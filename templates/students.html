{% extends "base.html" %}
{% block content %}
<h2>Students</h2>

<form method="get" class="row">
  <input type="text" name="q" placeholder="Search by ID or Name" value="{{ q }}">
  <select name="class">
    <option value="">All Classes</option>
    {% for c in classes %}
      <option value="{{ c }}" {% if selected_class == c %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>
  <button type="submit">Filter</button>
  <a class="btn" href="{{ url_for('add_student') }}">Add Student</a>
</form>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Name</th><th>Class</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.student_id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.class }}</td>
      <td>
        <a href="{{ url_for('edit_student', student_id=s.student_id) }}">Edit</a>
        <form action="{{ url_for('delete_student', student_id=s.student_id) }}" method="post" style="display:inline" onsubmit="return confirm('Delete this student?');">
          <button type="submit" class="link danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
